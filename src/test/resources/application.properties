spring.application.name=fianceiro-test

# H2 In-Memory Database for fast, reliable and isolated tests
spring.datasource.url=jdbc:h2:mem:financeiro_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# JWT Security
jwt.secret=9a4f2c8d3e5b7a1f6c8d2e4a7b9c1d3e5f8a0b2c4d6e8f1a3b5c7d9e2f4a6b8c
jwt.expiration=86400000

