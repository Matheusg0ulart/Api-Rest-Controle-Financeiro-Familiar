spring.application.name=fianceiro

# MySQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/financeiro_familiar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=${PORT:8080}

# JWT Security
jwt.secret=${JWT_SECRET:9a4f2c8d3e5b7a1f6c8d2e4a7b9c1d3e5f8a0b2c4d6e8f1a3b5c7d9e2f4a6b8c}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
